<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="inner-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#avatar-grad)" opacity="0.9" />
  <circle cx="100" cy="100" r="86" fill="url(#inner-grad)" />
  
  <!-- Subtle Grid/Orb Lines -->
  <circle cx="100" cy="100" r="65" stroke="url(#avatar-grad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" fill="none" />
  <circle cx="100" cy="100" r="45" stroke="#38bdf8" stroke-width="1" opacity="0.3" fill="none" />
  
  <!-- Stylized Tech Logo / Monogram: An stylized AI Core & 'H' / Brain Node -->
  <g transform="translate(100, 100)">
    <!-- Central Hexagonal Core -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="url(#avatar-grad)" stroke-width="3" />
    <!-- Node connections -->
    <line x1="0" y1="-28" x2="0" y2="-45" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-45" r="4" fill="#38bdf8" />
    
    <line x1="24" y1="14" x2="42" y2="24" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="42" cy="24" r="4" fill="#818cf8" />
    
    <line x1="-24" y1="14" x2="-42" y2="24" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-42" cy="24" r="4" fill="#c084fc" />
    
    <!-- Inner glowing spark -->
    <circle cx="0" cy="0" r="10" fill="url(#avatar-grad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
</svg>
